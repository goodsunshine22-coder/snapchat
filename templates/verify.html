<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sandbox Verification</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 20%, #302900, transparent 35%),
        #090909;
}

.card {
    width: 430px;
    max-width: 92%;
    padding: 40px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.16);
    backdrop-filter: blur(25px);
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
}

.icon {
    font-size: 60px;
}

p {
    color: #aaa;
    line-height: 1.5;
}

input {
    width: 100%;
    padding: 15px;
    margin-top: 12px;
    border: 0;
    outline: none;
    border-radius: 13px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 18px;
    border: 0;
    border-radius: 14px;
    background: #ffd900;
    color: #111;
    font-weight: bold;
    cursor: pointer;
}

.note {
    margin-top: 20px;
    color: #777;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="card">

    <div class="icon">🔐</div>

    <h1>Sandbox Verification</h1>

    <p>
        Enter your verification sandbox ID to continue.
    </p>

    <form action="/verify" method="POST">

        <input
            type="text"
            name="verification_sandbox_id"
            placeholder="TEST-VERIFY-123"
            required
        >

        <button type="submit">
            Confirm
        </button>

    </form>

    <div class="note">
        Sandbox/test identifier only.
    </div>

</div>

</body>
</html>
