<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversion Complete</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 20%, #4b4100, transparent 35%),
        #080808;
}

.card {
    width: 450px;
    max-width: 92%;
    padding: 45px;
    text-align: center;
    border-radius: 30px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.16);
    backdrop-filter: blur(25px);
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
}

.check {
    font-size: 70px;
}

.amount {
    margin: 25px;
    font-size: 48px;
    font-weight: bold;
    color: #ffd900;
}

button {
    display: inline-block;
    padding: 15px 25px;
    border: 0;
    border-radius: 14px;
    background: #ffd900;
    color: #111;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="card">

    <div class="check">✓</div>

    <h1>Conversion Complete</h1>

    <div class="amount">
        ${{ amount }}
    </div>

    <p>Sandbox confirmation complete.</p>

    <form action="/verify" method="GET">
        <button type="submit">
            Continue
        </button>
    </form>

</div>

</body>
</html>
