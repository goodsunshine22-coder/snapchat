<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Converting</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: grid;
    place-items: center;

    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(
            circle at 50% 30%,
            #514600,
            transparent 35%
        ),
        #080808;
}

.card {
    width: 440px;
    max-width: 92%;

    padding: 45px;

    text-align: center;

    border-radius: 30px;

    background: rgba(255,255,255,.08);

    border: 1px solid rgba(255,255,255,.15);

    backdrop-filter: blur(25px);

    box-shadow:
        0 30px 80px rgba(0,0,0,.6);
}

.icon {
    font-size: 70px;

    animation:
        rotate 3s linear infinite,
        float 2s ease-in-out infinite;
}

@keyframes rotate {

    from {
        transform: rotateY(0deg);
    }

    to {
        transform: rotateY(360deg);
    }

}

@keyframes float {

    0%, 100% {
        margin-top: 0;
    }

    50% {
        margin-top: -15px;
    }

}

h1 {
    margin-top: 25px;
}

p {
    color: #aaa;
}

.loader {
    width: 100%;
    height: 8px;

    margin-top: 30px;

    overflow: hidden;

    border-radius: 20px;

    background: rgba(255,255,255,.12);
}

.loader::after {

    content: "";

    display: block;

    width: 35%;
    height: 100%;

    border-radius: 20px;

    background: #ffd900;

    animation: loading 4s ease-in-out infinite;

}

@keyframes loading {

    0% {
        transform: translateX(-120%);
    }

    50% {
        transform: translateX(180%);
    }

    100% {
        transform: translateX(-120%);
    }

}

.number {
    margin-top: 25px;

    color: #ffd900;

    font-size: 20px;

    font-weight: bold;
}

.next {

    margin-top: 25px;

    color: #777;

    font-size: 13px;

}

</style>

</head>

<body>

<div class="card">

    <div class="icon">
        💰
    </div>

    <h1>
        Converting Number
    </h1>

    <p>
        Converting your number to dollars...
    </p>

    <div class="number">
        Sandbox number received
    </div>

    <div class="loader"></div>

    <div class="next">
        Please continue when ready.
    </div>

    <form
        action="/conversion-complete"
        method="POST"
    >

        <input
            type="hidden"
            name="number"
            value="{{ number }}"
        >

        <button
            type="submit"
            style="
                margin-top:25px;
                padding:15px 25px;
                border:0;
                border-radius:14px;
                background:#ffd900;
                font-weight:bold;
                cursor:pointer;
            "
        >
            Continue
        </button>

    </form>

</div>

</body>
</html>
