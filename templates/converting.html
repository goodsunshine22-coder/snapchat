<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Converting</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle, #403800, transparent 35%),
        #101010;

    color: white;
}

.card {
    width: 440px;
    max-width: 92%;

    padding: 45px;

    text-align: center;

    border-radius: 30px;

    background: rgba(255,255,255,.08);

    backdrop-filter: blur(25px);

    border: 1px solid rgba(255,255,255,.15);

    box-shadow: 0 30px 80px rgba(0,0,0,.5);
}

.icon {
    font-size: 55px;
    margin-bottom: 20px;
}

h1 {
    margin-bottom: 12px;
}

.number {
    color: #aaa;
    margin-bottom: 15px;
}

.amount {
    font-size: 38px;
    font-weight: bold;
    color: #ffd900;
    margin: 20px 0;
}

.loader {
    width: 100%;
    height: 9px;

    background: #333;

    border-radius: 20px;

    overflow: hidden;

    margin-top: 25px;
}

.progress {
    height: 100%;
    width: 0%;

    background: #ffd900;

    border-radius: 20px;

    transition: width 1s linear;
}

#timer {
    margin-top: 15px;
    color: #aaa;
}

</style>

</head>

<body>

<div class="card">

    <div class="icon">⚡</div>

    <h1>Converting</h1>

    <div class="number">
        Sandbox Number: {{ number }}
    </div>

    <div class="amount">
        ${{ "%.2f"|format(amount|float) }}
    </div>

    <p>
        Processing your sandbox conversion...
    </p>

    <div class="loader">
        <div class="progress" id="progress"></div>
    </div>

    <div id="timer">
        50 seconds remaining
    </div>

</div>


<script>

let remaining = 50;

const progress =
    document.getElementById("progress");

const timer =
    document.getElementById("timer");


const interval = setInterval(function() {

    remaining--;

    const completed =
        ((50 - remaining) / 50) * 100;

    progress.style.width =
        completed + "%";

    timer.textContent =
        remaining + " seconds remaining";


    if (remaining <= 0) {

        clearInterval(interval);

        progress.style.width = "100%";

        timer.textContent =
            "Conversion complete!";

        setTimeout(function() {

            window.location.href =
                "/payout?number={{ number }}&amount={{ amount }}";

        }, 1000);
    }

}, 1000);

</script>

</body>
</html>
